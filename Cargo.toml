[package]
name = "arango-vector-inspector"
version = "0.1.0"
edition = "2024"
description = "Offline inspector for ArangoDB RocksDB vector indexes"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rocksdb = { version = "0.22", default-features = false, features = ["snappy", "lz4"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
faiss = { version = "0.13", optional = true }
faiss-sys = { version = "0.7", optional = true }
nalgebra = { version = "0.33", optional = true }
voronator = { version = "0.2", optional = true }
bhtsne = { version = "0.5", default-features = false, optional = true }
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"], optional = true }

[features]
default = ["ui"]
# Full local UI: pulls in the GUI, FAISS decode, and 2D projection stack.
ui = ["dep:eframe", "dep:faiss", "dep:faiss-sys", "dep:nalgebra", "dep:voronator", "dep:bhtsne"]
# Headless remote reader: RocksDB + serde only, no GUI/FAISS. Build with
#   cargo build --release --no-default-features --features serve
serve = []

[profile.release]
lto = "thin"
codegen-units = 1
